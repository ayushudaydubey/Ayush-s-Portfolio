<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#07040f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#p2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#130e24" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#1c1436"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Tech Inject Design Library — Component CLI &amp; Package Exporter</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#090614" stroke="#3b2b68" stroke-width="1.2"/>
    <text x="30" y="45" fill="#a855f7" font-family="monospace" font-size="14">$ npx tech-inject init</text>
    <text x="30" y="75" fill="#94a3b8" font-family="monospace" font-size="12">? Which styling framework are you using? › Tailwind CSS</text>
    <text x="30" y="100" fill="#94a3b8" font-family="monospace" font-size="12">? Which icon library do you prefer? › Lucide React</text>
    <text x="30" y="125" fill="#94a3b8" font-family="monospace" font-size="12">? Where should components be installed? › @/components/ui</text>
    <text x="30" y="160" fill="#10b981" font-family="monospace" font-size="12">✔ Configuration saved to tech-inject.json</text>
    
    <text x="30" y="205" fill="#a855f7" font-family="monospace" font-size="14">$ npx tech-inject add command-palette magnetic-button</text>
    <text x="30" y="235" fill="#e2e8f0" font-family="monospace" font-size="12">Fetching component metadata from registry...</text>
    <text x="30" y="260" fill="#10b981" font-family="monospace" font-size="12">✔ components/ui/command-palette.tsx created (TypeScript + ARIA)</text>
    <text x="30" y="285" fill="#10b981" font-family="monospace" font-size="12">✔ components/ui/magnetic-button.tsx created (Framer Motion)</text>
    <text x="30" y="315" fill="#c084fc" font-family="monospace" font-size="12">✔ Installed peer dependencies: framer-motion, lucide-react</text>
    <text x="30" y="355" fill="#38bdf8" font-family="monospace" font-size="13">Ready! Import anywhere with: import { MagneticButton } from "@/components/ui/magnetic-button"</text>
  </g>
</svg>
