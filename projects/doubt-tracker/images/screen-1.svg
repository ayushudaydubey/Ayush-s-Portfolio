      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Recent Doubt Feed (Showing Open &amp; In-Review)</text>
      
      <!-- Issue Row 1 -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="800" height="70" rx="6" fill="#1a1006" stroke="#f59e0b" stroke-width="1"/>
        <text x="20" y="30" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">MongoDB E11000 duplicate key error in sharded cluster</text>
        <text x="20" y="52" fill="#f59e0b" font-family="monospace" font-size="11">#database #mongodb #indexes</text>
        <rect x="700" y="20" width="80" height="26" rx="4" fill="#ef4444" fill-opacity="0.2"/>
        <text x="725" y="37" fill="#f87171" font-family="system-ui" font-size="11" font-weight="700">OPEN</text>
      </g>

      <!-- Issue Row 2 -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="800" height="70" rx="6" fill="#140c04"/>
        <text x="20" y="30" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Framer Motion layoutId morphing jumps during grid reflow</text>
        <text x="20" y="52" fill="#f59e0b" font-family="monospace" font-size="11">#frontend #react #animation</text>
