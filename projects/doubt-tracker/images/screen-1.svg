      <g transform="translate(0, 215)">
        <rect x="0" y="0" width="800" height="70" rx="6" fill="#140c04"/>
        <text x="20" y="30" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700">Next.js 15 static export with dynamic routes failing</text>
        <text x="20" y="52" fill="#f59e0b" font-family="monospace" font-size="11">#nextjs #typescript #static-export</text>
        <rect x="690" y="20" width="90" height="26" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="704" y="37" fill="#34d399" font-family="system-ui" font-size="11" font-weight="700">RESOLVED</text>
