<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cz3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="100%" stop-color="#02090b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#cz3)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0b222a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#0f2b35"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">ChatZone — Real-Time WebSocket Telemetry &amp; Auth Guard</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#071920" stroke="#164352" stroke-width="1"/>
    <text x="30" y="40" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">WebSocket Session Telemetry &amp; Handshake</text>

    <!-- Telemetry snippet -->
    <rect x="30" y="65" width="800" height="150" rx="6" fill="#040f13"/>
    <text x="50" y="95" fill="#22d3ee" font-family="monospace" font-size="11">[Socket.io Client] Connection established: wss://chatzone-backend.onrender.com</text>
    <text x="50" y="120" fill="#10b981" font-family="monospace" font-size="11">✔ Handshake JWT authenticated: user_id: 'ayush_dubey' • role: 'developer'</text>
    <text x="50" y="145" fill="#94a3b8" font-family="monospace" font-size="11">[Heartbeat] Ping-Pong roundtrip latency: 18ms</text>
    <text x="50" y="170" fill="#a78bfa" font-family="monospace" font-size="11">[Room] Joined 'general-chat' room channel broadcast</text>

    <!-- Bottom summary -->
    <rect x="30" y="240" width="800" height="145" rx="6" fill="#0a2028"/>
    <text x="50" y="275" fill="#22d3ee" font-family="system-ui" font-size="13" font-weight="700">Security &amp; Rate Limiting Architecture:</text>
    <text x="50" y="305" fill="#cbd5e1" font-family="system-ui" font-size="12">1. Token-authenticated socket handshakes with sliding expiration.</text>
    <text x="50" y="330" fill="#cbd5e1" font-family="system-ui" font-size="12">2. Token-bucket rate limiting preventing message spam attacks.</text>
    <text x="50" y="355" fill="#cbd5e1" font-family="system-ui" font-size="12">3. MongoDB persistent chat history hydration with indexed cursor pagination.</text>
  </g>
