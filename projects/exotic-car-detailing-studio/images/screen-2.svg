<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#g2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#150e08" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#22170d"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Interactive Before &amp; After Paint Correction Slider</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#1c1209" stroke="#3d2614" stroke-width="1"/>
    
    <!-- Split canvas simulation -->
    <g transform="translate(30, 30)">
      <!-- Left side: Swirls & Oxidation -->
      <rect x="0" y="0" width="400" height="300" rx="6" fill="#231a14"/>
      <!-- Swirl marks lines -->
      <path d="M 50,80 Q 90,60 130,80 Q 170,100 210,80" stroke="#78716c" stroke-width="1.5" fill="none"/>
      <path d="M 120,140 Q 160,120 200,140 Q 240,160 280,140" stroke="#78716c" stroke-width="1.5" fill="none"/>
      <path d="M 70,200 Q 110,180 150,200 Q 190,220 230,200" stroke="#78716c" stroke-width="1.5" fill="none"/>
      <rect x="20" y="20" width="130" height="30" rx="4" fill="#000000" fill-opacity="0.6"/>
      <text x="35" y="40" fill="#f87171" font-family="system-ui" font-size="11" font-weight="700">BEFORE (Swirls)</text>

      <!-- Right side: Glass Gloss Reflection -->
      <rect x="400" y="0" width="400" height="300" rx="6" fill="#090503"/>
      <!-- Glossy mirror reflection lines -->
      <line x1="420" y1="20" x2="680" y2="280" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="3"/>
      <line x1="480" y1="20" x2="740" y2="280" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="420" y="20" width="160" height="30" rx="4" fill="#000000" fill-opacity="0.6"/>
      <text x="435" y="40" fill="#10b981" font-family="system-ui" font-size="11" font-weight="700">AFTER (Mirror Finish)</text>

      <!-- Divider line & drag handle -->
      <line x1="400" y1="0" x2="400" y2="300" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="400" cy="150" r="18" fill="#f59e0b"/>
      <text x="393" y="155" fill="#000000" font-family="system-ui" font-size="14" font-weight="800">↔</text>
    </g>

    <text x="35" y="375" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="600">Drag to inspect swirl removal on Obsidian Black clear coat under high-CRI inspection lamps</text>
  </g>
</svg>
