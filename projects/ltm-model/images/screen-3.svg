<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ltm3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0719"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#ltm3)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#140824" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#1f0f35"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">LTM Model — Dynamic Sampling &amp; Temperature Tuning</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#10061c" stroke="#351759" stroke-width="1"/>
    <text x="30" y="38" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Inference Hyperparameter Calibration</text>

    <g transform="translate(30, 65)">
      <!-- Param 1 -->
      <rect x="0" y="0" width="380" height="95" rx="6" fill="#170929" stroke="#351759" stroke-width="1"/>
      <text x="20" y="30" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Temperature (0.2 - Strict Factuality)</text>
      <rect x="20" y="50" width="340" height="8" rx="4" fill="#090310"/>
      <rect x="20" y="50" width="80" height="8" rx="4" fill="#a855f7"/>
      <circle cx="100" cy="54" r="7" fill="#c084fc"/>

      <!-- Param 2 -->
      <rect x="420" y="0" width="380" height="95" rx="6" fill="#170929" stroke="#351759" stroke-width="1"/>
      <text x="440" y="30" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Top-p Nucleus Sampling (0.95)</text>
      <rect x="440" y="50" width="340" height="8" rx="4" fill="#090310"/>
      <rect x="440" y="50" width="300" height="8" rx="4" fill="#ec4899"/>
      <circle cx="740" cy="54" r="7" fill="#f472b6"/>

      <!-- Param 3 -->
      <rect x="0" y="115" width="380" height="95" rx="6" fill="#170929" stroke="#351759" stroke-width="1"/>
      <text x="20" y="145" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Repetition Penalty (1.15)</text>
      <rect x="20" y="165" width="340" height="8" rx="4" fill="#090310"/>
      <rect x="20" y="165" width="220" height="8" rx="4" fill="#38bdf8"/>
      <circle cx="240" cy="169" r="7" fill="#38bdf8"/>

      <!-- Param 4 -->
      <rect x="420" y="115" width="380" height="95" rx="6" fill="#170929" stroke="#351759" stroke-width="1"/>
      <text x="440" y="145" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Max Sequence Tokens (8,192)</text>
      <rect x="440" y="165" width="340" height="8" rx="4" fill="#090310"/>
      <rect x="440" y="165" width="330" height="8" rx="4" fill="#10b981"/>
      <circle cx="770" cy="169" r="7" fill="#34d399"/>
    </g>

    <rect x="30" y="300" width="800" height="85" rx="6" fill="#140724"/>
    <text x="50" y="335" fill="#10b981" font-family="system-ui" font-size="12" font-weight="700">✔ Parameters Synced to Render Endpoint</text>
    <text x="50" y="358" fill="#94a3b8" font-family="monospace" font-size="11">POST https://ltm-model.onrender.com/api/v1/calibrate { temp: 0.2, top_p: 0.95, rep_penalty: 1.15, max_tokens: 8192 }</text>
  </g>
</svg>
