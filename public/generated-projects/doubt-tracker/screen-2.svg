<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120803"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#dt2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#140b04" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#241407"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Doubt Tracker — Thread Detail &amp; Code Solution Verification</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#100803" stroke="#3d210b" stroke-width="1"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="25" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Question: How to write safe MongoDB compound transactions?</text>
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui" font-size="11">Asked 2 hours ago • Category: Backend Systems • Author: dev_user</text>

      <rect x="0" y="65" width="800" height="110" rx="6" fill="#070301" stroke="#3d210b" stroke-width="1"/>
      <text x="20" y="95" fill="#f59e0b" font-family="monospace" font-size="11">const session = await mongoose.startSession();</text>
      <text x="20" y="120" fill="#f59e0b" font-family="monospace" font-size="11">session.startTransaction();</text>
      <text x="20" y="145" fill="#34d399" font-family="monospace" font-size="11">await session.commitTransaction(); session.endSession();</text>

      <!-- Verified badge -->
      <rect x="0" y="195" width="800" height="150" rx="6" fill="#1c1106" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="225" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700">★ ACCEPTED SOLUTION by Ayush Dubey</text>
      <text x="20" y="250" fill="#cbd5e1" font-family="system-ui" font-size="11">Always wrap `commitTransaction` in a try/catch and invoke `abortTransaction()` within the catch block to release row write locks.</text>
      <text x="20" y="280" fill="#a8a29e" font-family="monospace" font-size="10">try { ... } catch (err) { await session.abortTransaction(); }</text>
    </g>
  </g>
</svg>
