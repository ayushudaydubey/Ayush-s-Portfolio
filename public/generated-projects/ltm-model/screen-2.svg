<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ltm2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0719"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#ltm2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#140824" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#1f0f35"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">LTM Model — Context Memory Retention Benchmark</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#10061c" stroke="#351759" stroke-width="1"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="700">Needle-In-A-Haystack Accuracy vs Sequence Length</text>
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui" font-size="11">Comparing LTM attention architecture against standard fixed-window transformers</text>

      <!-- Chart visualizer -->
      <g transform="translate(0, 65)">
        <rect x="0" y="0" width="800" height="220" rx="6" fill="#07020d" stroke="#2b1147" stroke-width="1"/>
        
        <!-- Grid lines -->
        <line x1="40" y1="180" x2="760" y2="180" stroke="#25123d" stroke-width="1"/>
        <line x1="40" y1="120" x2="760" y2="120" stroke="#25123d" stroke-width="1"/>
        <line x1="40" y1="60" x2="760" y2="60" stroke="#25123d" stroke-width="1"/>

        <!-- LTM Model Curve (High & Steady) -->
        <polyline points="40,55 180,55 360,58 540,62 720,68" fill="none" stroke="url(#chartGrad)" stroke-width="3.5"/>
        <circle cx="720" cy="68" r="5" fill="#38bdf8"/>
        <text x="730" y="72" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">LTM (98%)</text>

        <!-- Baseline Model Curve (Decays) -->
        <polyline points="40,55 180,75 360,110 540,150 720,175" fill="none" stroke="#f43f5e" stroke-dasharray="6,6" stroke-width="2"/>
        <text x="730" y="178" fill="#f87171" font-family="system-ui" font-size="11">Standard (42%)</text>

        <!-- X Axis labels -->
        <text x="40" y="205" fill="#64748b" font-family="monospace" font-size="10">1k tokens</text>
        <text x="260" y="205" fill="#64748b" font-family="monospace" font-size="10">2k tokens</text>
        <text x="480" y="205" fill="#64748b" font-family="monospace" font-size="10">4k tokens</text>
        <text x="700" y="205" fill="#64748b" font-family="monospace" font-size="10">8k tokens</text>
      </g>

      <rect x="0" y="300" width="800" height="85" rx="6" fill="#170929"/>
      <text x="20" y="330" fill="#a855f7" font-family="system-ui" font-size="12" font-weight="700">Observed Result:</text>
      <text x="20" y="355" fill="#e2e8f0" font-family="system-ui" font-size="11">The LTM model sustains over 98% fact retrieval accuracy even when needles are placed at arbitrary depths up to 8,192 tokens.</text>
    </g>
  </g>
</svg>
