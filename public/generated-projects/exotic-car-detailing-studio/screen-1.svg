<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#g1)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#150e08" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#22170d"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Luxury Vehicle Estimator &amp; Package Selector</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#1c1209" stroke="#3d2614" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Vehicle Classification &amp; Paint Treatment Scope</text>
    
    <!-- Vehicle Selection Cards -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="250" height="110" rx="6" fill="#29180d" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="32" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="700">Coupe / Supercar (Selected)</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="system-ui" font-size="11">Ferrari, Porsche 911, McLaren</text>
      <text x="20" y="80" fill="#a8a29e" font-family="system-ui" font-size="10">Base Bay Time: 18 - 24 Hours</text>

      <rect x="280" y="0" width="250" height="110" rx="6" fill="#140d06" stroke="#3d2614" stroke-width="1"/>
      <text x="300" y="32" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Executive Sedan</text>
      <text x="300" y="55" fill="#94a3b8" font-family="system-ui" font-size="11">BMW M5, Mercedes S-Class</text>
      <text x="300" y="80" fill="#64748b" font-family="system-ui" font-size="10">Base Bay Time: 24 - 30 Hours</text>

      <rect x="560" y="0" width="250" height="110" rx="6" fill="#140d06" stroke="#3d2614" stroke-width="1"/>
      <text x="580" y="32" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Performance SUV</text>
      <text x="580" y="55" fill="#94a3b8" font-family="system-ui" font-size="11">Lamborghini Urus, G-Wagon</text>
      <text x="580" y="80" fill="#64748b" font-family="system-ui" font-size="10">Base Bay Time: 32 - 40 Hours</text>
    </g>

    <!-- Detailed Checklist -->
    <g transform="translate(25, 200)">
      <text x="0" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="700">Included In Ultimate Ceramic Protection Tier:</text>
      <text x="0" y="50" fill="#f59e0b" font-family="system-ui" font-size="11">✔ 2-Stage Paint Correction (Removing 95%+ swirl marks and hazing)</text>
      <text x="0" y="75" fill="#f59e0b" font-family="system-ui" font-size="11">✔ Gtechniq Crystal Serum Ultra 10H ceramic bonding with warranty registration</text>
      <text x="0" y="100" fill="#f59e0b" font-family="system-ui" font-size="11">✔ Wheel faces, calipers, and exhaust tips coated against brake dust adhesion</text>
      <text x="0" y="125" fill="#f59e0b" font-family="system-ui" font-size="11">✔ Hydrophobic glass sealant on all exterior windows</text>

      <rect x="560" y="35" width="250" height="70" rx="6" fill="url(#gold)"/>
      <text x="600" y="75" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="800">Lock In Studio Slot →</text>
    </g>
