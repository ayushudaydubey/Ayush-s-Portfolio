<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bg1)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0f1923" stroke="#84cc16" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#152332"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Telemetry Visualizer — Live Worker Pools &amp; Memory Bounds</text>
  
  <!-- Content -->
  <g transform="translate(70, 110)">
    <!-- Chart area -->
    <rect x="0" y="0" width="550" height="260" rx="8" fill="#13202c" stroke="#253a4d" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">Real-Time Throughput Trend (Rows / Second)</text>
    <polyline points="30,220 90,190 150,210 210,130 270,140 330,90 390,110 450,70 510,60" fill="none" stroke="url(#lime)" stroke-width="3"/>
    <!-- Dots -->
    <circle cx="210" cy="130" r="4" fill="#a3e635"/>
    <circle cx="330" cy="90" r="4" fill="#a3e635"/>
    <circle cx="450" cy="70" r="4" fill="#a3e635"/>
    <circle cx="510" cy="60" r="5" fill="#10b981"/>
    <text x="500" y="45" fill="#a3e635" font-family="system-ui" font-size="11" font-weight="700">26,450 r/s</text>

    <!-- Side Stats -->
    <rect x="580" y="0" width="280" height="260" rx="8" fill="#13202c" stroke="#253a4d" stroke-width="1"/>
    <text x="600" y="32" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="600">Worker Pool Stats</text>
    <text x="600" y="65" fill="#94a3b8" font-family="system-ui" font-size="11">Active Cores: 8 threads</text>
    <text x="600" y="90" fill="#94a3b8" font-family="system-ui" font-size="11">Average Core Load: 74%</text>
    <text x="600" y="115" fill="#94a3b8" font-family="system-ui" font-size="11">Event Loop Delay: 1.1ms</text>
    <text x="600" y="140" fill="#94a3b8" font-family="system-ui" font-size="11">Backpressure Pauses: 0</text>
    <rect x="600" y="170" width="240" height="60" rx="6" fill="#0d1720" stroke="#84cc16" stroke-width="1"/>
    <text x="615" y="195" fill="#a3e635" font-family="system-ui" font-size="11" font-weight="600">STATE: HEALTHY</text>
    <text x="615" y="215" fill="#64748b" font-family="system-ui" font-size="10">Zero memory saturation events</text>
  </g>

  <!-- Bottom Table -->
  <g transform="translate(70, 395)">
    <rect x="0" y="0" width="860" height="135" rx="8" fill="#13202c" stroke="#253a4d" stroke-width="1"/>
    <text x="20" y="26" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Active Worksheets Ingestion Queue</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="11">leads_q4_enterprise.xlsx (Sheet1 - 500k rows) &gt; [========================] 88%</text>
    <text x="20" y="80" fill="#94a3b8" font-family="monospace" font-size="11">emea_contacts_raw.xlsx (Contacts - 320k rows)   &gt; [==================......] 65%</text>
    <text x="20" y="105" fill="#94a3b8" font-family="monospace" font-size="11">latam_prospects.csv (Raw - 750k rows)          &gt; [============............] 42%</text>
  </g>
</svg>
