<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="50%" stop-color="#0b1319"/>
      <stop offset="100%" stop-color="#06090c"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="250" y1="0" x2="250" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="850" y1="0" x2="850" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="160" fill="#a3e635" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="520" r="180" fill="#10b981" opacity="0.1" filter="url(#glow)"/>

  <!-- Main Dashboard Window -->
  <rect x="80" y="70" width="1040" height="535" rx="16" fill="#0e1720" stroke="#a3e635" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Top bar -->
  <rect x="80" y="70" width="1040" height="48" rx="16" fill="#14212d"/>
  <circle cx="112" cy="94" r="6" fill="#ef4444"/>
  <circle cx="132" cy="94" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="94" r="6" fill="#10b981"/>
  <text x="180" y="99" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Prospect Data Engine — High-Throughput Worker Thread Ingestion Console (v2.4)</text>
  <rect x="940" y="82" width="160" height="24" rx="12" fill="#1c2f3d"/>
  <circle cx="955" cy="94" r="4" fill="#a3e635"/>
  <text x="968" y="98" fill="#a3e635" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4 THREADS ACTIVE</text>

  <!-- Metric Cards Row -->
  <g transform="translate(110, 140)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="225" height="90" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="16" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">THROUGHPUT</text>
    <text x="16" y="60" fill="#a3e635" font-family="system-ui, sans-serif" font-size="24" font-weight="700">26,450</text>
    <text x="110" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">rows/sec</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="225" height="90" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="266" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TOTAL PROCESSED</text>
    <text x="266" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">1,482,900</text>
    <text x="390" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">/ 2.5M</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="225" height="90" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="516" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HEAP UTILIZATION</text>
    <text x="516" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">142 MB</text>
    <text x="616" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">/ 512 MB Max</text>

    <!-- Card 4 -->
    <rect x="750" y="0" width="230" height="90" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="766" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CHECKPOINTS SAVED</text>
    <text x="766" y="60" fill="#a3e635" font-family="system-ui, sans-serif" font-size="24" font-weight="700">1,482</text>
    <text x="836" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">0 failed chunks</text>
  </g>

  <!-- Worker Thread Visualizer -->
  <g transform="translate(110, 255)">
    <rect x="0" y="0" width="475" height="210" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Worker Thread Pool Allocation</text>
    
    <!-- Thread 1 -->
    <text x="20" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Thread #1 [XLSX Chunk 0-250k]</text>
    <rect x="20" y="75" width="435" height="12" rx="6" fill="#1e293b"/>
    <rect x="20" y="75" width="410" height="12" rx="6" fill="url(#limeGrad)"/>

    <!-- Thread 2 -->
    <text x="20" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Thread #2 [XLSX Chunk 250k-500k]</text>
    <rect x="20" y="122" width="435" height="12" rx="6" fill="#1e293b"/>
    <rect x="20" y="122" width="370" height="12" rx="6" fill="url(#limeGrad)"/>

    <!-- Thread 3 -->
    <text x="20" y="159" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Thread #3 [XLSX Chunk 500k-750k]</text>
    <rect x="20" y="169" width="435" height="12" rx="6" fill="#1e293b"/>
    <rect x="20" y="169" width="290" height="12" rx="6" fill="url(#limeGrad)"/>
  </g>

  <!-- Live Stream Ingestion Logs -->
  <g transform="translate(610, 255)">
    <rect x="0" y="0" width="470" height="210" rx="10" fill="#0b131a" stroke="#2d4559" stroke-width="1"/>
    <text x="20" y="30" fill="#a3e635" font-family="monospace" font-size="12">[STREAM TELEMETRY OK]</text>
    
    <text x="20" y="60" fill="#64748b" font-family="monospace" font-size="11">14:02:11 [Worker-1] Batch #1420 flushed (5,000 rows in 184ms)</text>
    <text x="20" y="85" fill="#64748b" font-family="monospace" font-size="11">14:02:12 [Checkpoint] Atomic marker commit #1481 to Redis</text>
    <text x="20" y="110" fill="#10b981" font-family="monospace" font-size="11">14:02:12 [PostgreSQL] Staging COPY stream transferred 5,000 records</text>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="11">14:02:13 [Worker-3] Memory GC cycle completed in 8.2ms</text>
    <text x="20" y="160" fill="#38bdf8" font-family="monospace" font-size="11">14:02:14 [Stream-In] Next 64MB buffer chunk read from /leads.xlsx</text>
    <text x="20" y="185" fill="#a3e635" font-family="monospace" font-size="11">14:02:15 [Worker-2] Zero schema anomalies found in batch #1421</text>
  </g>

  <!-- Bottom status bar -->
  <g transform="translate(110, 485)">
    <rect x="0" y="0" width="970" height="95" rx="10" fill="#13202c" stroke="#2d4559" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Engine Pipeline Architecture</text>
    <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Multi-Gigabyte Excel Input &gt; SAX Stream Splitting &gt; Worker Thread Decompression &gt; Redis Checkpoints &gt; PostgreSQL COPY</text>
    <rect x="20" y="72" width="930" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="72" width="680" height="6" rx="3" fill="url(#limeGrad)"/>
  </g>
</svg>
