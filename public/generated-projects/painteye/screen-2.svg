<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#b2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0c1930" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#142646"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Color Palette Extraction &amp; K-Means Clustering</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#122340" stroke="#254374" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Uploaded Image Chromatographic Breakdown</text>
    <text x="25" y="60" fill="#94a3b8" font-family="system-ui" font-size="12">K-Means clustering algorithm identified 5 distinct dominant chromatic regions in 18ms</text>

    <!-- Swatch blocks -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="150" height="180" rx="8" fill="#2d5584"/>
      <rect x="0" y="120" width="150" height="60" rx="8" fill="#08101e"/>
      <text x="15" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">#2D5584</text>
      <text x="15" y="165" fill="#38bdf8" font-family="system-ui" font-size="11">Dominant (42%)</text>

      <rect x="170" y="0" width="150" height="180" rx="8" fill="#1e3a5f"/>
      <rect x="170" y="120" width="150" height="60" rx="8" fill="#08101e"/>
      <text x="185" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">#1E3A5F</text>
      <text x="185" y="165" fill="#38bdf8" font-family="system-ui" font-size="11">Shadow (28%)</text>

      <rect x="340" y="0" width="150" height="180" rx="8" fill="#e2d4c0"/>
      <rect x="340" y="120" width="150" height="60" rx="8" fill="#08101e"/>
      <text x="355" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">#E2D4C0</text>
      <text x="355" y="165" fill="#a3e635" font-family="system-ui" font-size="11">Highlight (16%)</text>

      <rect x="510" y="0" width="150" height="180" rx="8" fill="#889da9"/>
      <rect x="510" y="120" width="150" height="60" rx="8" fill="#08101e"/>
      <text x="525" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">#889DA9</text>
      <text x="525" y="165" fill="#94a3b8" font-family="system-ui" font-size="11">Midtone (9%)</text>

      <rect x="680" y="0" width="130" height="180" rx="8" fill="#3e2e28"/>
      <rect x="680" y="120" width="130" height="60" rx="8" fill="#08101e"/>
      <text x="695" y="145" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">#3E2E28</text>
      <text x="695" y="165" fill="#f59e0b" font-family="system-ui" font-size="11">Accent (5%)</text>
    </g>

    <!-- Prisma Query log -->
    <rect x="25" y="300" width="810" height="95" rx="6" fill="#070e1c" stroke="#1d365f" stroke-width="1"/>
    <text x="40" y="330" fill="#38bdf8" font-family="monospace" font-size="11">Prisma Client Query executed in 14ms:</text>
    <text x="40" y="355" fill="#94a3b8" font-family="monospace" font-size="11">SELECT id, brand, name, hex, l, a, b FROM "PaintFormulation" WHERE cube_distance(cie_cube, '(24.1, 1.2, -18.4)') &lt; 2.5 ORDER BY cie_distance ASC LIMIT 5;</text>
  </g>
</svg>
