<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="blueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a172e"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="bFilter">
      <feGaussianBlur stdDeviation="30" result="bf"/>
      <feComposite in="SourceGraphic" in2="bf" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#blueBg)"/>
  <circle cx="1000" cy="160" r="180" fill="#38bdf8" opacity="0.15" filter="url(#bFilter)"/>
  <circle cx="200" cy="500" r="180" fill="#2563eb" opacity="0.12" filter="url(#bFilter)"/>

  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#0d1b33" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#142646"/>
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>
  <text x="180" y="89" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">PaintEye — Architectural Color Intelligence &amp; Prisma Catalog Studio</text>
  <rect x="940" y="72" width="160" height="24" rx="12" fill="#1d365f"/>
  <text x="965" y="88" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">PRISMA + POSTGRES</text>

  <!-- Left: Room Visualizer Preview -->
  <g transform="translate(110, 130)">
    <rect x="0" y="0" width="560" height="310" rx="10" fill="#0b1527" stroke="#254374" stroke-width="1.2"/>
    <rect x="0" y="0" width="560" height="36" rx="10" fill="#13233e"/>
    <text x="20" y="23" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Simulated Room Ambient Lighting Visualizer</text>
    
    <!-- Room simulation illustration -->
    <rect x="25" y="55" width="510" height="195" rx="8" fill="#192a47"/>
    <!-- Simulated wall in deep navy teal -->
    <polygon points="25,55 350,55 310,210 25,250" fill="#1e3a5f"/>
    <!-- Accent wall -->
    <polygon points="350,55 535,55 535,250 310,210" fill="#2d5584"/>
    <!-- Floor -->
    <polygon points="25,250 310,210 535,250" fill="#141f33"/>

    <!-- Room overlay tag -->
    <rect x="40" y="70" width="190" height="50" rx="6" fill="#0b1527" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
    <text x="50" y="90" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">SELECTED: SHERWIN #6244</text>
    <text x="50" y="108" fill="#94a3b8" font-family="system-ui" font-size="10">Naval Blue (CIE-L*a*b*: 24.1, 1.2, -18.4)</text>

    <!-- Slider -->
    <g transform="translate(25, 265)">
      <text x="0" y="16" fill="#cbd5e1" font-family="system-ui" font-size="11" font-weight="600">Ambient Temp: 4200K (Neutral Daylight)</text>
      <rect x="220" y="8" width="280" height="8" rx="4" fill="#0e1b2f"/>
      <rect x="220" y="8" width="160" height="8" rx="4" fill="url(#cyanGrad)"/>
      <circle cx="380" cy="12" r="8" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Right: Prisma Catalog Queries & Swatches -->
  <g transform="translate(695, 130)">
    <rect x="0" y="0" width="395" height="310" rx="10" fill="#0b1527" stroke="#254374" stroke-width="1.2"/>
    <rect x="0" y="0" width="395" height="36" rx="10" fill="#13233e"/>
    <text x="20" y="23" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">PostgreSQL CIE-Lab Nearest Matches</text>

    <!-- Swatch Cards -->
    <g transform="translate(20, 50)">
      <!-- Swatch 1 -->
      <rect x="0" y="0" width="355" height="48" rx="6" fill="#13233e"/>
      <rect x="8" y="8" width="32" height="32" rx="4" fill="#1e3a5f"/>
      <text x="50" y="26" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Naval Blue #1E3A5F</text>
      <text x="50" y="40" fill="#38bdf8" font-family="system-ui" font-size="10">ΔE: 0.42 • Exact Match</text>

      <!-- Swatch 2 -->
      <rect x="0" y="58" width="355" height="48" rx="6" fill="#13233e"/>
      <rect x="8" y="66" width="32" height="32" rx="4" fill="#2d5584"/>
      <text x="50" y="84" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Pacific Twilight #2D5584</text>
      <text x="50" y="98" fill="#38bdf8" font-family="system-ui" font-size="10">ΔE: 1.18 • Complementary</text>

      <!-- Swatch 3 -->
      <rect x="0" y="116" width="355" height="48" rx="6" fill="#13233e"/>
      <rect x="8" y="124" width="32" height="32" rx="4" fill="#e2d4c0"/>
      <text x="50" y="142" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Oatmeal Linen #E2D4C0</text>
      <text x="50" y="156" fill="#a3e635" font-family="system-ui" font-size="10">Ideal Trim Accent</text>

      <!-- Prisma Query code snippet -->
      <rect x="0" y="174" width="355" height="74" rx="6" fill="#060b14"/>
      <text x="12" y="196" fill="#60a5fa" font-family="monospace" font-size="10">await prisma.paintColor.findMany({</text>
      <text x="12" y="214" fill="#94a3b8" font-family="monospace" font-size="10">  where: { cieDistance: { lte: 2.0 } },</text>
      <text x="12" y="232" fill="#38bdf8" font-family="monospace" font-size="10">  orderBy: { deltaE: 'asc' }, take: 10 })</text>
    </g>
  </g>

  <!-- Bottom: Metrics Bar -->
  <g transform="translate(110, 465)">
    <rect x="0" y="0" width="980" height="125" rx="10" fill="#0e1c36" stroke="#254374" stroke-width="1"/>
    <g transform="translate(40, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">15,000+</text>
      <text x="0" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Indexed Formulations</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Major brand catalogs</text>
    </g>
    <g transform="translate(280, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">&lt; 45ms</text>
      <text x="0" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Spatial Index Query</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">PostgreSQL cube distance</text>
    </g>
    <g transform="translate(520, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">ΔE &lt; 2.0</text>
      <text x="0" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Perceptual Accuracy</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">CIE-L*a*b* calibrated</text>
    </g>
    <g transform="translate(760, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Next.js 15</text>
      <text x="0" y="55" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">App Router &amp; Prisma</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Edge-ready architecture</text>
    </g>
  </g>
</svg>
