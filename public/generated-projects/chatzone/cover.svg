<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="czBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041419"/>
      <stop offset="50%" stop-color="#072026"/>
      <stop offset="100%" stop-color="#020d10"/>
    </linearGradient>
    <linearGradient id="czGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="czGlow">
      <feGaussianBlur stdDeviation="30" result="czg"/>
      <feComposite in="SourceGraphic" in2="czg" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#czBg)"/>
  <circle cx="980" cy="150" r="180" fill="#06b6d4" opacity="0.16" filter="url(#czGlow)"/>
  <circle cx="200" cy="500" r="180" fill="#14b8a6" opacity="0.12" filter="url(#czGlow)"/>

  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#091b22" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0f2b35"/>
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>
  <text x="180" y="89" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">ChatZone — Real-Time WebSocket Messaging &amp; Presence Hub</text>
  <rect x="940" y="72" width="160" height="24" rx="12" fill="#163e4c"/>
  <circle cx="955" cy="84" r="4" fill="#10b981"/>
  <text x="968" y="88" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">SOCKET.IO CONNECTED</text>

  <!-- Left: Channels Sidebar -->
  <g transform="translate(110, 130)">
    <rect x="0" y="0" width="240" height="310" rx="10" fill="#0b222a" stroke="#164352" stroke-width="1.2"/>
    <text x="20" y="32" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">CHANNELS &amp; ROOMS</text>
    
    <rect x="15" y="50" width="210" height="36" rx="6" fill="#133644"/>
    <text x="30" y="73" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700"># general-chat</text>
    <circle cx="205" cy="68" r="4" fill="#10b981"/>

    <rect x="15" y="92" width="210" height="36" rx="6" fill="#0b222a"/>
    <text x="30" y="115" fill="#94a3b8" font-family="system-ui" font-size="12"># tech-stack-discussion</text>

    <rect x="15" y="134" width="210" height="36" rx="6" fill="#0b222a"/>
    <text x="30" y="157" fill="#94a3b8" font-family="system-ui" font-size="12"># bug-squashing</text>

    <text x="20" y="200" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">ONLINE USERS (8)</text>
    <text x="30" y="230" fill="#e2e8f0" font-family="system-ui" font-size="11">● Ayush Dubey (You)</text>
    <text x="30" y="255" fill="#94a3b8" font-family="system-ui" font-size="11">● Alex Morgan</text>
    <text x="30" y="280" fill="#94a3b8" font-family="system-ui" font-size="11">● Sarah Chen</text>
  </g>

  <!-- Right: Conversation Stream -->
  <g transform="translate(370, 130)">
    <rect x="0" y="0" width="720" height="310" rx="10" fill="#071920" stroke="#164352" stroke-width="1.2"/>
    <rect x="0" y="0" width="720" height="42" rx="10" fill="#0d2833"/>
    <text x="20" y="26" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="700"># general-chat</text>
    <text x="140" y="26" fill="#14b8a6" font-family="system-ui" font-size="11">● 142 messages today</text>

    <!-- Message 1 -->
    <g transform="translate(25, 60)">
      <circle cx="16" cy="16" r="16" fill="#1e3a8a"/>
      <text x="12" y="21" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">A</text>
      <text x="42" y="14" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700">Alex Morgan</text>
      <text x="130" y="14" fill="#64748b" font-family="system-ui" font-size="10">15:42</text>
      <text x="42" y="34" fill="#e2e8f0" font-family="system-ui" font-size="12">Has anyone tested the latest WebSocket reconnect timeout handling?</text>
    </g>

    <!-- Message 2 (Ayush bubble) -->
    <g transform="translate(180, 120)">
      <rect x="0" y="0" width="510" height="60" rx="10" fill="#134e5e"/>
      <text x="20" y="25" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">Ayush Dubey (Lead Dev)</text>
      <text x="20" y="45" fill="#ffffff" font-family="system-ui" font-size="12">Yes! The heartbeat ping-pong drop threshold is down to &lt;25ms with auto-reconnect.</text>
    </g>

    <!-- Typing Indicator -->
    <g transform="translate(25, 205)">
      <circle cx="6" cy="6" r="3" fill="#22d3ee"/>
      <circle cx="16" cy="6" r="3" fill="#22d3ee" opacity="0.7"/>
      <circle cx="26" cy="6" r="3" fill="#22d3ee" opacity="0.4"/>
      <text x="38" y="10" fill="#94a3b8" font-family="system-ui" font-size="11" font-style="italic">Sarah Chen is typing...</text>
    </g>

    <!-- Input Box -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="680" height="50" rx="8" fill="#0d2631" stroke="#1c5568" stroke-width="1"/>
      <text x="20" y="30" fill="#64748b" font-family="system-ui" font-size="12">Type a message in #general-chat...</text>
      <rect x="600" y="10" width="65" height="30" rx="6" fill="url(#czGrad)"/>
      <text x="618" y="29" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Send</text>
    </g>
  </g>

  <!-- Bottom: Metrics Bar -->
  <g transform="translate(110, 465)">
    <rect x="0" y="0" width="980" height="125" rx="10" fill="#0b222a" stroke="#164352" stroke-width="1"/>
    <g transform="translate(40, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">&lt; 25ms</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">WebSocket Sync</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Bi-directional event loops</text>
    </g>
    <g transform="translate(280, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Socket.io</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">Room Broadcasting</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Group channels &amp; DMs</text>
    </g>
    <g transform="translate(520, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Heartbeat</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">Presence Tracking</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Zero stale ghost sessions</text>
    </g>
    <g transform="translate(760, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">MERN Stack</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">MongoDB + Express</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Vercel live deployment</text>
    </g>
  </g>
</svg>
