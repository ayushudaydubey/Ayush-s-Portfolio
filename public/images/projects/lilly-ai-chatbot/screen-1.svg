<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ai1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0719"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#ai1)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#140824" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#200d38"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Streaming Code Explanation with Syntax Highlighter</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#10061c" stroke="#351759" stroke-width="1"/>
    
    <!-- Code response container -->
    <g transform="translate(30, 25)">
      <text x="0" y="20" fill="#f472b6" font-family="system-ui" font-size="13" font-weight="700">Lilly AI Assistant:</text>
      <text x="0" y="45" fill="#cbd5e1" font-family="system-ui" font-size="12">Here is how to set up an atomic MongoDB reservation lock with an auto-expiring TTL index:</text>

      <!-- Code Box -->
      <rect x="0" y="65" width="800" height="230" rx="8" fill="#07020d" stroke="#a855f7" stroke-width="1"/>
      <rect x="0" y="65" width="800" height="32" rx="8" fill="#180a2b"/>
      <text x="15" y="86" fill="#a78bfa" font-family="monospace" font-size="11">reservation-lock.ts (TypeScript)</text>
      <rect x="710" y="72" width="75" height="20" rx="4" fill="#2d134c"/>
      <text x="722" y="86" fill="#e2e8f0" font-family="system-ui" font-size="10">📋 Copy</text>

      <g transform="translate(15, 115)">
        <text x="0" y="15" fill="#a855f7" font-family="monospace" font-size="11">import { Schema, model } from 'mongoose';</text>
        <text x="0" y="40" fill="#38bdf8" font-family="monospace" font-size="11">const BayLockSchema = new Schema({</text>
        <text x="20" y="65" fill="#e2e8f0" font-family="monospace" font-size="11">bayId: { type: String, required: true },</text>
        <text x="20" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">sessionId: { type: String, required: true },</text>
        <text x="20" y="115" fill="#f43f5e" font-family="monospace" font-size="11">createdAt: { type: Date, default: Date.now, expires: 600 } // 10 min TTL</text>
        <text x="0" y="140" fill="#38bdf8" font-family="monospace" font-size="11">});</text>
      </g>

      <!-- Streaming cursor indicator -->
      <g transform="translate(0, 315)">
        <circle cx="10" cy="10" r="4" fill="#a855f7"/>
        <text x="25" y="14" fill="#a78bfa" font-family="system-ui" font-size="11">Tokens streaming via SSE • 84 t/s • Scroll lock engaged</text>
      </g>
    </g>
  </g>
</svg>
