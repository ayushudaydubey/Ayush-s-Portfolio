<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0719"/>
      <stop offset="50%" stop-color="#190a2a"/>
      <stop offset="100%" stop-color="#080310"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="30" result="ag"/>
      <feComposite in="SourceGraphic" in2="ag" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#aiBg)"/>
  <circle cx="980" cy="150" r="180" fill="#a855f7" opacity="0.15" filter="url(#aiGlow)"/>
  <circle cx="200" cy="500" r="180" fill="#ec4899" opacity="0.12" filter="url(#aiGlow)"/>

  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#130822" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#1f0f35"/>
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>
  <text x="180" y="89" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Lilly AI Chatbot — Real-Time SSE Token Streaming &amp; Code Assistant</text>
  <rect x="940" y="72" width="160" height="24" rx="12" fill="#351759"/>
  <text x="965" y="88" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700">OPENAI + SSE STREAM</text>

  <!-- Left: Conversation Stream Area -->
  <g transform="translate(110, 130)">
    <rect x="0" y="0" width="650" height="310" rx="10" fill="#0d0517" stroke="#37185e" stroke-width="1.2"/>
    <rect x="0" y="0" width="650" height="38" rx="10" fill="#180b2a"/>
    <text x="20" y="24" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Thread: Distributed Architecture &amp; Caching Strategy</text>

    <!-- User bubble -->
    <g transform="translate(25, 55)">
      <rect x="180" y="0" width="420" height="42" rx="8" fill="#2d134c"/>
      <text x="200" y="26" fill="#ffffff" font-family="system-ui" font-size="12">How should I implement SSE token streaming in Node.js?</text>
    </g>

    <!-- AI Response with code block -->
    <g transform="translate(25, 110)">
      <rect x="0" y="0" width="600" height="175" rx="8" fill="#160c28" stroke="#a855f7" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="url(#aiGrad)"/>
      <text x="36" y="24" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700">Lilly AI (Senior Architect Persona):</text>
      <text x="20" y="50" fill="#cbd5e1" font-family="system-ui" font-size="11">Set proper response headers for Server-Sent Events, then write chunks:</text>

      <!-- Code block -->
      <rect x="20" y="65" width="560" height="95" rx="6" fill="#090310" stroke="#37185e" stroke-width="1"/>
      <text x="35" y="88" fill="#a855f7" font-family="monospace" font-size="10">res.setHeader('Content-Type', 'text/event-stream');</text>
      <text x="35" y="106" fill="#a855f7" font-family="monospace" font-size="10">res.setHeader('Cache-Control', 'no-cache');</text>
      <text x="35" y="124" fill="#38bdf8" font-family="monospace" font-size="10">for await (const chunk of stream) res.write(`data: ${chunk}\n\n`);</text>
      <text x="35" y="145" fill="#10b981" font-family="monospace" font-size="10">res.write('event: end\ndata: [DONE]\n\n');</text>
    </g>
  </g>

  <!-- Right: Persona Selector & Model Stats -->
  <g transform="translate(780, 130)">
    <rect x="0" y="0" width="310" height="310" rx="10" fill="#0d0517" stroke="#37185e" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="38" rx="10" fill="#180b2a"/>
    <text x="20" y="24" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Active Persona &amp; Controls</text>

    <!-- Persona pills -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="280" height="42" rx="6" fill="#2d134c" stroke="#a855f7" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">⚡ System Architect (Active)</text>

      <rect x="0" y="52" width="280" height="42" rx="6" fill="#140924"/>
      <text x="15" y="77" fill="#94a3b8" font-family="system-ui" font-size="11">💻 Full Stack Code Reviewer</text>

      <rect x="0" y="104" width="280" height="42" rx="6" fill="#140924"/>
      <text x="15" y="129" fill="#94a3b8" font-family="system-ui" font-size="11">🎯 Technical Interviewer</text>

      <!-- Token telemetry -->
      <rect x="0" y="160" width="280" height="75" rx="6" fill="#140924"/>
      <text x="15" y="185" fill="#cbd5e1" font-family="system-ui" font-size="11" font-weight="600">Telemetry Stream</text>
      <text x="15" y="205" fill="#a855f7" font-family="monospace" font-size="10">TTFT: 38ms • Speed: 84 tokens/s</text>
      <text x="15" y="222" fill="#10b981" font-family="monospace" font-size="10">Status: Connection Open (Keep-Alive)</text>
    </g>
  </g>

  <!-- Bottom: Metrics Bar -->
  <g transform="translate(110, 465)">
    <rect x="0" y="0" width="980" height="125" rx="10" fill="#160a28" stroke="#37185e" stroke-width="1"/>
    <g transform="translate(40, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">&lt; 40ms</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Time-To-First-Token</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">SSE streaming proxy</text>
    </g>
    <g transform="translate(280, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">40+ Langs</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Syntax Highlighted</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Prism.js token parsing</text>
    </g>
    <g transform="translate(520, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">6 Personas</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">System Prompt Tuning</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Tailored AI agent context</text>
    </g>
    <g transform="translate(760, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Smart Lock</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Auto-Scroll Observer</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Zero reading jitter</text>
    </g>
  </g>
</svg>
