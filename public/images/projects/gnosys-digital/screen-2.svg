      <text x="25" y="40" fill="#f472b6" font-family="system-ui" font-size="16" font-weight="700">01 / Full Stack Web Systems</text>
      <text x="25" y="70" fill="#cbd5e1" font-family="system-ui" font-size="12">Next.js App Router, TypeScript, server-side streaming, and ultra-resilient backends.</text>
