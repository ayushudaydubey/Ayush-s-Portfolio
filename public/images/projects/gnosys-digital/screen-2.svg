    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#pk2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#180a14" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#240f1f"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
