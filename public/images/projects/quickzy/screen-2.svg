<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051417"/>
      <stop offset="100%" stop-color="#02090b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#q2)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0b2025" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#11323a"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Slide-Over Cart Drawer &amp; Promo Code Engine</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="480" height="420" rx="8" fill="#0d262d" stroke="#184a54" stroke-width="1"/>
    <text x="25" y="35" fill="#94a3b8" font-family="system-ui" font-size="12">Store Background (Faded Overlay)</text>
    <rect x="25" y="60" width="430" height="180" rx="6" fill="#091b1f" opacity="0.6"/>

    <!-- Slide Over Drawer active on right -->
    <rect x="500" y="0" width="360" height="420" rx="8" fill="#102e36" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="525" y="35" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="700">Your Cart (2 items)</text>

    <!-- Cart items -->
    <g transform="translate(520, 60)">
      <rect x="0" y="0" width="320" height="65" rx="6" fill="#091c22"/>
      <text x="15" y="26" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Aero ANC Headphones (Matte Black)</text>
      <text x="15" y="48" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">$299.00</text>
      <text x="250" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">Qty: 1</text>

      <rect x="0" y="75" width="320" height="65" rx="6" fill="#091c22"/>
      <text x="15" y="101" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Mechanical Keychron Q1 Pro</text>
      <text x="15" y="123" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">$179.00</text>
      <text x="250" y="123" fill="#cbd5e1" font-family="system-ui" font-size="11">Qty: 1</text>

      <!-- Promo code input -->
      <rect x="0" y="155" width="220" height="36" rx="6" fill="#07171c" stroke="#184a54" stroke-width="1"/>
      <text x="15" y="178" fill="#22d3ee" font-family="monospace" font-size="11">TECHDEV20</text>
      <rect x="230" y="155" width="90" height="36" rx="6" fill="#06b6d4"/>
      <text x="255" y="178" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Apply</text>
      <text x="0" y="210" fill="#10b981" font-family="system-ui" font-size="10">✔ 20% discount applied (-$95.60)</text>

      <!-- Total & Action -->
      <rect x="0" y="235" width="320" height="100" rx="6" fill="#0a2127"/>
      <text x="15" y="260" fill="#94a3b8" font-family="system-ui" font-size="11">Total Due:</text>
      <text x="220" y="260" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="800">$382.40</text>
      <rect x="15" y="280" width="290" height="40" rx="6" fill="#06b6d4"/>
      <text x="85" y="305" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Proceed to Checkout →</text>
    </g>
  </g>
</svg>
