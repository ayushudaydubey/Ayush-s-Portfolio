<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041215"/>
      <stop offset="50%" stop-color="#081e22"/>
      <stop offset="100%" stop-color="#030d0f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="30" result="cg"/>
      <feComposite in="SourceGraphic" in2="cg" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#cyanBg)"/>
  <circle cx="980" cy="150" r="180" fill="#06b6d4" opacity="0.15" filter="url(#cyanGlow)"/>
  <circle cx="200" cy="500" r="180" fill="#14b8a6" opacity="0.12" filter="url(#cyanGlow)"/>

  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#091b1f" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#102b31"/>
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>
  <text x="180" y="89" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Quickzy — High-Performance MERN Stack E-Commerce Platform</text>
  <rect x="940" y="72" width="160" height="24" rx="12" fill="#18414a"/>
  <text x="965" y="88" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">MERN + OPTIMISTIC UI</text>

  <!-- Main Storefront Catalog & Slide-Over Cart -->
  <g transform="translate(110, 130)">
    <!-- Storefront Section -->
    <rect x="0" y="0" width="640" height="310" rx="10" fill="#0b2228" stroke="#184a54" stroke-width="1.2"/>
    <rect x="0" y="0" width="640" height="42" rx="10" fill="#11323a"/>
    <text x="20" y="26" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Flash Sale Products • Filter: Electronics (Active)</text>
    <rect x="420" y="8" width="200" height="26" rx="13" fill="#08181c" stroke="#184a54" stroke-width="1"/>
    <text x="440" y="25" fill="#94a3b8" font-family="system-ui" font-size="11">🔍 Search 1,200+ items...</text>

    <!-- Product Cards -->
    <g transform="translate(20, 58)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="185" height="230" rx="8" fill="#0f2b32" stroke="#22d3ee" stroke-width="1"/>
      <rect x="15" y="15" width="155" height="110" rx="6" fill="#08191d"/>
      <circle cx="92" cy="70" r="30" fill="#153e48" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="15" y="145" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Aero ANC Headphones</text>
      <text x="15" y="165" fill="#22d3ee" font-family="system-ui" font-size="14" font-weight="800">$299.00</text>
      <rect x="15" y="185" width="155" height="30" rx="6" fill="url(#cyanGrad)"/>
      <text x="50" y="204" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">+ Add To Cart</text>

      <!-- Item 2 -->
      <rect x="205" y="0" width="185" height="230" rx="8" fill="#0f2b32" stroke="#184a54" stroke-width="1"/>
      <rect x="220" y="15" width="155" height="110" rx="6" fill="#08191d"/>
      <circle cx="297" cy="70" r="30" fill="#153e48" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="220" y="145" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Ultra Pro Mechanical</text>
      <text x="220" y="165" fill="#22d3ee" font-family="system-ui" font-size="14" font-weight="800">$179.00</text>
      <rect x="220" y="185" width="155" height="30" rx="6" fill="#123b44"/>
      <text x="255" y="204" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">+ Add To Cart</text>

      <!-- Item 3 -->
      <rect x="410" y="0" width="185" height="230" rx="8" fill="#0f2b32" stroke="#184a54" stroke-width="1"/>
      <rect x="425" y="15" width="155" height="110" rx="6" fill="#08191d"/>
      <circle cx="502" cy="70" r="30" fill="#153e48" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="425" y="145" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">Studio 4K Monitor</text>
      <text x="425" y="165" fill="#22d3ee" font-family="system-ui" font-size="14" font-weight="800">$649.00</text>
      <rect x="425" y="185" width="155" height="30" rx="6" fill="#123b44"/>
      <text x="460" y="204" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">+ Add To Cart</text>
    </g>

    <!-- Slide-Over Optimistic Cart -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="320" height="310" rx="10" fill="#0d252b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="0" y="0" width="320" height="42" rx="10" fill="#143740"/>
      <text x="20" y="26" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Shopping Cart (2 Items)</text>
      <rect x="260" y="10" width="45" height="22" rx="4" fill="#1e4e5b"/>
      <text x="270" y="25" fill="#22d3ee" font-family="system-ui" font-size="10" font-weight="700">LIVE</text>

      <!-- Cart Item 1 -->
      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="290" height="55" rx="6" fill="#081a1e"/>
        <text x="12" y="24" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Aero ANC Headphones</text>
        <text x="12" y="42" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">Qty: 1 • $299.00</text>
        <text x="245" y="32" fill="#f87171" font-family="system-ui" font-size="11">✕</text>

        <!-- Cart Item 2 -->
        <rect x="0" y="65" width="290" height="55" rx="6" fill="#081a1e"/>
        <text x="12" y="89" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="600">Ultra Pro Mechanical</text>
        <text x="12" y="107" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="700">Qty: 1 • $179.00</text>
        <text x="245" y="97" fill="#f87171" font-family="system-ui" font-size="11">✕</text>

        <!-- Cart Total & Checkout -->
        <rect x="0" y="135" width="290" height="100" rx="6" fill="#0e2a31"/>
        <text x="15" y="160" fill="#94a3b8" font-family="system-ui" font-size="11">Subtotal:</text>
        <text x="220" y="160" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="700">$478.00</text>
        <text x="15" y="180" fill="#10b981" font-family="system-ui" font-size="10">Free Express Shipping</text>
        <rect x="15" y="195" width="260" height="32" rx="6" fill="url(#cyanGrad)"/>
        <text x="80" y="215" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Checkout Now →</text>
      </g>
    </g>
  </g>

  <!-- Bottom: Metrics Bar -->
  <g transform="translate(110, 465)">
    <rect x="0" y="0" width="980" height="125" rx="10" fill="#0b2228" stroke="#184a54" stroke-width="1"/>
    <g transform="translate(40, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">&lt; 25ms</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">Instant Search Filter</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Debounced catalog queries</text>
    </g>
    <g transform="translate(280, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">0ms</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">Optimistic UI Latency</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Instant cart state feedback</text>
    </g>
    <g transform="translate(520, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Atomic</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">Inventory Protection</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Zero negative stock oversells</text>
    </g>
    <g transform="translate(760, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">JWT Auth</text>
      <text x="0" y="55" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="600">HttpOnly Security</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Bcrypt password hashing</text>
    </g>
  </g>
</svg>
