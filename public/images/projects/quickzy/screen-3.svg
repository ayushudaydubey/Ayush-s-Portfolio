<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="q3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051417"/>
      <stop offset="100%" stop-color="#02090b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#q3)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0b2025" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#11323a"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Admin Inventory &amp; Stock Threshold Portal</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#0d262d" stroke="#184a54" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Stock Inventory Matrix &amp; Atomic Depletion Alerts</text>
    
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="810" height="48" rx="6" fill="#133742"/>
      <text x="20" y="28" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">SKU / ITEM</text>
      <text x="250" y="28" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">CURRENT STOCK</text>
      <text x="450" y="28" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">STATUS</text>
      <text x="650" y="28" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">ACTION</text>

      <rect x="0" y="55" width="810" height="48" rx="6" fill="#091c22"/>
      <text x="20" y="83" fill="#cbd5e1" font-family="system-ui" font-size="11">QZ-ANC-880 (Aero Headphones)</text>
      <text x="250" y="83" fill="#22d3ee" font-family="monospace" font-size="12">142 units</text>
      <text x="450" y="83" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">In Stock</text>
      <text x="650" y="83" fill="#38bdf8" font-family="system-ui" font-size="11">Edit Listing</text>

      <rect x="0" y="110" width="810" height="48" rx="6" fill="#091c22"/>
      <text x="20" y="138" fill="#cbd5e1" font-family="system-ui" font-size="11">QZ-KBD-Q1 (Keychron Q1 Pro)</text>
      <text x="250" y="138" fill="#f59e0b" font-family="monospace" font-size="12">8 units remaining</text>
      <text x="450" y="138" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="600">Low Stock Warning</text>
      <text x="650" y="138" fill="#38bdf8" font-family="system-ui" font-size="11">Reorder +50</text>

      <rect x="0" y="165" width="810" height="48" rx="6" fill="#091c22"/>
      <text x="20" y="193" fill="#cbd5e1" font-family="system-ui" font-size="11">QZ-DISP-4K (Studio Monitor)</text>
      <text x="250" y="193" fill="#22d3ee" font-family="monospace" font-size="12">29 units</text>
      <text x="450" y="193" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">In Stock</text>
      <text x="650" y="193" fill="#38bdf8" font-family="system-ui" font-size="11">Edit Listing</text>
    </g>

    <!-- Node/Mongo code snippet -->
    <rect x="25" y="300" width="810" height="95" rx="6" fill="#051216"/>
    <text x="40" y="325" fill="#22d3ee" font-family="monospace" font-size="11">Atomic Mongoose decrement on order checkout:</text>
    <text x="40" y="350" fill="#94a3b8" font-family="monospace" font-size="11">await Product.findOneAndUpdate({ _id: productId, stock: { $gte: quantity } }, { $inc: { stock: -quantity } }, { new: true });</text>
  </g>
</svg>
