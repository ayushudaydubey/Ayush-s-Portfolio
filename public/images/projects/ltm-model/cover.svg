<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ltmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0719"/>
      <stop offset="50%" stop-color="#180a29"/>
      <stop offset="100%" stop-color="#080310"/>
    </linearGradient>
    <linearGradient id="ltmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="ltmGlow">
      <feGaussianBlur stdDeviation="30" result="lglow"/>
      <feComposite in="SourceGraphic" in2="lglow" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ltmBg)"/>
  <circle cx="980" cy="150" r="180" fill="#a855f7" opacity="0.16" filter="url(#ltmGlow)"/>
  <circle cx="200" cy="500" r="180" fill="#ec4899" opacity="0.12" filter="url(#ltmGlow)"/>

  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#130822" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#1f0f35"/>
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>
  <text x="180" y="89" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">LTM Model — Long-Term Memory Neural Sequence Inference Studio</text>
  <rect x="940" y="72" width="160" height="24" rx="12" fill="#351759"/>
  <circle cx="955" cy="84" r="4" fill="#10b981"/>
  <text x="968" y="88" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700">LIVE ON RENDER</text>

  <!-- Left: Sequence Generator Pane -->
  <g transform="translate(110, 130)">
    <rect x="0" y="0" width="560" height="310" rx="10" fill="#0d0517" stroke="#37185e" stroke-width="1.2"/>
    <rect x="0" y="0" width="560" height="38" rx="10" fill="#180b2a"/>
    <text x="20" y="24" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Model Inference Workspace (LTM-7B-Instruct)</text>

    <!-- Prompt area -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="520" height="65" rx="6" fill="#160927" stroke="#2a1244" stroke-width="1"/>
      <text x="15" y="24" fill="#a78bfa" font-family="monospace" font-size="11">Prompt: Analyze memory persistence across 8k context window...</text>
      <text x="15" y="46" fill="#64748b" font-family="monospace" font-size="10">Target facts: [Fact-A: Token 120], [Fact-B: Token 4100]</text>
    </g>

    <!-- Streaming output area -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="520" height="115" rx="6" fill="#090310" stroke="#37185e" stroke-width="1"/>
      <text x="15" y="26" fill="#f472b6" font-family="system-ui" font-size="11" font-weight="700">LTM Model Output:</text>
      <text x="15" y="50" fill="#e2e8f0" font-family="system-ui" font-size="11">Recall verified. Fact-A and Fact-B successfully referenced with 98.4%</text>
      <text x="15" y="70" fill="#e2e8f0" font-family="system-ui" font-size="11">attention probability weighting without hallucination decay.</text>
      <text x="15" y="98" fill="#38bdf8" font-family="monospace" font-size="10">Inference: 62 tokens/sec • Latency: 42ms • Context: 8,192 tokens</text>
    </g>

    <!-- Execution CTA -->
    <rect x="20" y="255" width="160" height="35" rx="6" fill="url(#ltmGrad)"/>
    <text x="50" y="277" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">Run Inference ⚡</text>
  </g>

  <!-- Right: Retention Curve & Parameters -->
  <g transform="translate(695, 130)">
    <rect x="0" y="0" width="395" height="310" rx="10" fill="#0d0517" stroke="#37185e" stroke-width="1.2"/>
    <rect x="0" y="0" width="395" height="38" rx="10" fill="#180b2a"/>
    <text x="20" y="24" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Memory Retention Curve</text>

    <!-- Chart -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="355" height="130" rx="6" fill="#140924"/>
      <!-- Curve -->
      <polyline points="20,110 80,100 160,85 240,65 320,40" fill="none" stroke="url(#ltmGrad)" stroke-width="3"/>
      <circle cx="20" cy="110" r="4" fill="#a855f7"/>
      <circle cx="160" cy="85" r="4" fill="#ec4899"/>
      <circle cx="320" cy="40" r="5" fill="#38bdf8"/>
      <text x="20" y="25" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="700">LTM Retention: 98.4% @ 8k Tokens</text>
    </g>

    <!-- Parameter Sliders -->
    <g transform="translate(20, 205)">
      <text x="0" y="16" fill="#cbd5e1" font-family="system-ui" font-size="11">Temperature: 0.2 (Strict Factuality)</text>
      <rect x="0" y="25" width="355" height="6" rx="3" fill="#1c0b30"/>
      <rect x="0" y="25" width="70" height="6" rx="3" fill="#a855f7"/>
      <circle cx="70" cy="28" r="6" fill="#c084fc"/>

      <text x="0" y="55" fill="#cbd5e1" font-family="system-ui" font-size="11">Context Window: 8,192 Tokens</text>
      <rect x="0" y="65" width="355" height="6" rx="3" fill="#1c0b30"/>
      <rect x="0" y="65" width="280" height="6" rx="3" fill="#ec4899"/>
      <circle cx="280" cy="68" r="6" fill="#f472b6"/>
    </g>
  </g>

  <!-- Bottom: Metrics Bar -->
  <g transform="translate(110, 465)">
    <rect x="0" y="0" width="980" height="125" rx="10" fill="#160a28" stroke="#37185e" stroke-width="1"/>
    <g transform="translate(40, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">8,192</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Token Context</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Extended sequence recall</text>
    </g>
    <g transform="translate(280, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">62 t/s</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Generation Speed</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Streamed inference tokens</text>
    </g>
    <g transform="translate(520, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Render</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Cloud Deployment</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Live high-availability host</text>
    </g>
    <g transform="translate(760, 25)">
      <text x="0" y="25" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">98.4%</text>
      <text x="0" y="55" fill="#c084fc" font-family="system-ui" font-size="12" font-weight="600">Memory Retention</text>
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Fact recall stability</text>
    </g>
  </g>
</svg>
