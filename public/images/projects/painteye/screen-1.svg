<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#b1)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0c1930" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#142646"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Ambient Lighting &amp; Kelvin Simulation Studio</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="550" height="420" rx="8" fill="#122340" stroke="#254374" stroke-width="1"/>
    <!-- Room simulation visual -->
    <rect x="20" y="20" width="510" height="300" rx="6" fill="#1a3154"/>
    <polygon points="20,20 320,20 280,260 20,320" fill="#254670"/>
    <polygon points="320,20 530,20 530,320 280,260" fill="#325b8e"/>
    <polygon points="20,320 280,260 530,320" fill="#121d30"/>
    
    <!-- Controls below -->
    <text x="25" y="355" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="600">Simulate Time of Day &amp; Bulb Emission</text>
    <rect x="25" y="375" width="500" height="8" rx="4" fill="#0a1424"/>
    <rect x="25" y="375" width="310" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="335" cy="379" r="8" fill="#38bdf8"/>
    <text x="350" y="383" fill="#cbd5e1" font-family="system-ui" font-size="11">5000K (Direct Sunlight)</text>
    
    <!-- Info panel on right -->
    <rect x="580" y="0" width="280" height="420" rx="8" fill="#122340" stroke="#254374" stroke-width="1"/>
    <text x="600" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Spectral Analysis</text>
    <text x="600" y="65" fill="#94a3b8" font-family="system-ui" font-size="11">CIE L*a*b*: 52.4, -4.1, 8.2</text>
    <text x="600" y="90" fill="#94a3b8" font-family="system-ui" font-size="11">Reflectance Index: 44.8%</text>
    <text x="600" y="115" fill="#94a3b8" font-family="system-ui" font-size="11">Finish: Eggshell Matte</text>

    <rect x="600" y="145" width="240" height="110" rx="6" fill="#0b172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="615" y="170" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">COMPLEMENTARY HARMONY</text>
    <text x="615" y="195" fill="#cbd5e1" font-family="system-ui" font-size="10">Base: Sage Breeze (#6D877A)</text>
    <text x="615" y="215" fill="#cbd5e1" font-family="system-ui" font-size="10">Trim: Linen Parchment (#EDE5D8)</text>
    <text x="615" y="235" fill="#cbd5e1" font-family="system-ui" font-size="10">Accent: Terra Cotta (#A45A42)</text>
  </g>
</svg>
