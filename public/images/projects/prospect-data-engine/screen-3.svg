<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bg3)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0f1923" stroke="#84cc16" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#152332"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Schema Mapper &amp; Anomaly Isolation Rules</text>
  
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#13202c" stroke="#253a4d" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">Dynamic Excel Header &gt; PostgreSQL Schema Transformation</text>
    <text x="25" y="60" fill="#94a3b8" font-family="system-ui" font-size="12">Map polymorphic spreadsheet columns to strict relational columns with regex sanitization</text>

    <!-- Mapping Rows -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="810" height="52" rx="6" fill="#182736"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">XLSX: [Full_Name_Raw]</text>
      <text x="260" y="30" fill="#a3e635" font-family="monospace" font-size="12">&gt;&gt; TRANSFORM &gt;&gt;</text>
      <text x="440" y="30" fill="#38bdf8" font-family="monospace" font-size="11">DB: lead_contacts.full_name (VARCHAR 128)</text>
      <rect x="710" y="14" width="80" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="725" y="30" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">PASSED</text>

      <rect x="0" y="65" width="810" height="52" rx="6" fill="#182736"/>
      <text x="20" y="95" fill="#94a3b8" font-family="monospace" font-size="11">XLSX: [Corp_Email_Address]</text>
      <text x="260" y="95" fill="#a3e635" font-family="monospace" font-size="12">&gt;&gt; SANITIZE (RFC5322) &gt;&gt;</text>
      <text x="440" y="95" fill="#38bdf8" font-family="monospace" font-size="11">DB: lead_contacts.email (UNIQUE INDEX)</text>
      <rect x="710" y="79" width="80" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="725" y="95" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">PASSED</text>

      <rect x="0" y="130" width="810" height="52" rx="6" fill="#182736"/>
      <text x="20" y="160" fill="#94a3b8" font-family="monospace" font-size="11">XLSX: [Annual_Rev_Est]</text>
      <text x="260" y="160" fill="#a3e635" font-family="monospace" font-size="12">&gt;&gt; NUMERIC_CAST &gt;&gt;</text>
      <text x="440" y="160" fill="#38bdf8" font-family="monospace" font-size="11">DB: lead_contacts.revenue_cents (BIGINT)</text>
      <rect x="710" y="144" width="80" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="725" y="160" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">PASSED</text>

      <rect x="0" y="195" width="810" height="52" rx="6" fill="#201c24" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="20" y="225" fill="#f43f5e" font-family="monospace" font-size="11">XLSX: [Unformatted_Phone]</text>
      <text x="260" y="225" fill="#f43f5e" font-family="monospace" font-size="12">&gt;&gt; E.164 VALIDATE &gt;&gt;</text>
      <text x="440" y="225" fill="#fda4af" font-family="monospace" font-size="11">ERR: Malformed country prefix [Line 184,210]</text>
      <rect x="710" y="209" width="80" height="24" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="718" y="225" fill="#f87171" font-family="system-ui" font-size="11" font-weight="600">ISOLATED</text>
    </g>
  </g>
</svg>
