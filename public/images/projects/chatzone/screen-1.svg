<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cz1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="100%" stop-color="#02090b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#cz1)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#0b222a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#0f2b35"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">ChatZone — Active Channels &amp; Real-Time Socket Stream</text>

  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="860" height="420" rx="8" fill="#071920" stroke="#164352" stroke-width="1"/>
    
    <!-- Channel sidebar snippet -->
    <rect x="20" y="20" width="220" height="380" rx="6" fill="#0d2833"/>
    <text x="40" y="50" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">CHANNELS</text>
    <text x="40" y="80" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600"># announcements</text>
    <text x="40" y="110" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700"># dev-standup (Active)</text>
    <text x="40" y="140" fill="#94a3b8" font-family="system-ui" font-size="12"># random</text>

    <!-- Main chat area -->
    <g transform="translate(260, 20)">
      <rect x="0" y="0" width="580" height="380" rx="6" fill="#091f27"/>
      
      <!-- Message bubbles -->
      <g transform="translate(20, 30)">
        <text x="0" y="15" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700">Ayush Dubey:</text>
        <rect x="0" y="25" width="460" height="45" rx="6" fill="#134352"/>
        <text x="15" y="52" fill="#ffffff" font-family="system-ui" font-size="12">Pushed the optimistic UI reducer fix for instant message rendering!</text>

        <text x="0" y="105" fill="#22d3ee" font-family="system-ui" font-size="12" font-weight="700">Sarah Chen:</text>
        <rect x="0" y="115" width="480" height="45" rx="6" fill="#0d2b35"/>
        <text x="15" y="142" fill="#e2e8f0" font-family="system-ui" font-size="12">Testing now on Vercel deployment. Message delivery latency is under 20ms!</text>

        <rect x="0" y="260" width="540" height="40" rx="6" fill="#07181e" stroke="#164352" stroke-width="1"/>
        <text x="15" y="285" fill="#64748b" font-family="system-ui" font-size="11">Send a message to #dev-standup...</text>
      </g>
    </g>
  </g>
</svg>
