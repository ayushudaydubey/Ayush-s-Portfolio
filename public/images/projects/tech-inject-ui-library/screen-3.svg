<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#07040f"/>
    </linearGradient>
    <linearGradient id="glowBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#p3)"/>
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#130e24" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="40" width="920" height="42" rx="12" fill="#1c1436"/>
  <circle cx="65" cy="61" r="5" fill="#ef4444"/>
  <circle cx="82" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="61" r="5" fill="#10b981"/>
  <text x="125" y="66" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">Motion Components &amp; Micro-Interaction Showcase</text>

  <g transform="translate(70, 110)">
    <!-- Interactive cards grid -->
    <rect x="0" y="0" width="265" height="190" rx="10" fill="#181130" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Magnetic Button</text>
    <text x="20" y="60" fill="#94a3b8" font-family="system-ui" font-size="11">Follows cursor on hover with dampening</text>
    <rect x="35" y="95" width="190" height="45" rx="22" fill="url(#glowBtn)"/>
    <text x="75" y="123" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">Hover Magnet</text>

    <rect x="295" y="0" width="265" height="190" rx="10" fill="#181130" stroke="#ec4899" stroke-width="1.5"/>
    <text x="315" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Glowing Border Card</text>
    <text x="315" y="60" fill="#94a3b8" font-family="system-ui" font-size="11">Conic gradient spinning spotlight</text>
    <circle cx="425" cy="115" r="40" fill="#241744" stroke="#ec4899" stroke-width="2"/>
    <text x="395" y="120" fill="#f472b6" font-family="system-ui" font-size="10" font-weight="700">Spotlight</text>

    <rect x="590" y="0" width="270" height="190" rx="10" fill="#181130" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="610" y="35" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="700">Dynamic Island</text>
    <text x="610" y="60" fill="#94a3b8" font-family="system-ui" font-size="11">Smooth morphing notification capsule</text>
    <rect x="625" y="100" width="200" height="38" rx="19" fill="#090614" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="645" cy="119" r="6" fill="#10b981"/>
    <text x="660" y="123" fill="#e2e8f0" font-family="system-ui" font-size="11">System: Synced</text>

    <!-- Bottom Showcase Banner -->
    <rect x="0" y="220" width="860" height="190" rx="10" fill="#181130" stroke="#3b2b68" stroke-width="1"/>
    <text x="30" y="260" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Theme Token Customization</text>
    <text x="30" y="285" fill="#94a3b8" font-family="system-ui" font-size="12">Edit semantic variables in your CSS file. Components react instantly to color shifts without rebuilds.</text>
    <rect x="30" y="315" width="24" height="24" rx="4" fill="#a855f7"/>
    <rect x="65" y="315" width="24" height="24" rx="4" fill="#ec4899"/>
    <rect x="100" y="315" width="24" height="24" rx="4" fill="#38bdf8"/>
    <rect x="135" y="315" width="24" height="24" rx="4" fill="#84cc16"/>
    <rect x="170" y="315" width="24" height="24" rx="4" fill="#f97316"/>
    <text x="215" y="332" fill="#c084fc" font-family="monospace" font-size="12">--accent: oklch(0.65 0.24 300);</text>
  </g>
</svg>
